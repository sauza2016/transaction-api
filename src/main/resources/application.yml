spring:
  application:
    name: transaction-api

  datasource:
    url: jdbc:postgresql://localhost:5432/transactions_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

transaction:
  provider:
    base-url: http://localhost:8081

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha